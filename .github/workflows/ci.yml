name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r src/requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test_*.py"
        env:
          PYTHONPATH: src

      - name: Compile Python sources
        run: python -m compileall -q src test

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check bandit==1.9.4 pip-audit==2.10.1

      - name: Audit dependencies
        run: python -m pip_audit --no-deps --disable-pip -r src/requirements.txt

      - name: Scan Python source
        run: python -m bandit -q -r src

  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the container
        run: docker build --tag picnic-demo-splitme:test .

      - name: Verify PDFtk is available
        run: docker run --entrypoint pdftk picnic-demo-splitme:test --version
